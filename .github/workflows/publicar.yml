# Verifica o código e publica o app no servidor a cada push no main.
# Configuração (uma vez só): docs/publicar.md

name: Publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Uma publicação por vez. No main, a próxima espera a anterior terminar: cancelar
# no meio deixaria o servidor com metade dos arquivos. Em pull request, cancela.
concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      # Só publica no push do main e se os acessos do servidor estiverem cadastrados.
      PUBLICAR: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.FTP_SENHA != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verificar o código
        run: npm run lint

      # O WhatsApp e os dados da loja ficam no banco (Painel › Dados da loja), não aqui.
      - name: Compilar
        run: npm run build

      # O FTP da hospedagem derruba envios longos, então vai um pacote só. No servidor,
      # deploy/app.js desempacota a versão nova em versoes/<id> quando o app reinicia.
      - name: Montar o pacote para o servidor
        run: |
          mkdir -p pacote/.next pacote/public publicar/tmp
          cp -r .next/standalone/. pacote/
          cp -r .next/static pacote/.next/static
          cp -r public/. pacote/public/
          tar -czf publicar/pacote.tar.gz -C pacote .
          echo "${GITHUB_SHA::12}" > publicar/pacote.id
          cp deploy/app.js publicar/app.js
          # Mudar este arquivo faz a hospedagem (Passenger) reiniciar o app.
          date -u +%Y-%m-%dT%H:%M:%SZ > publicar/tmp/restart.txt
          ls -la publicar

      - name: Escrever as configurações do servidor
        if: env.PUBLICAR == 'true'
        env:
          FTP_USUARIO: ${{ secrets.FTP_USUARIO }}
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          SESSAO_SEGREDO: ${{ secrets.SESSAO_SEGREDO }}
          PAINEL_SENHA: ${{ secrets.PAINEL_SENHA }}
          # Administração fixa (libera os outros em Acessos); a PAINEL_SENHA é a chave de emergência dela.
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS || 'luizbrasil.rj@gmail.com' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://monebrigaderia.com.br' }}
          UPLOAD_DIR: ${{ vars.UPLOAD_DIR }}
        run: |
          umask 077
          {
            echo "MYSQL_HOST=${MYSQL_HOST:-localhost}"
            echo "MYSQL_USER=$MYSQL_USER"
            echo "MYSQL_PASSWORD=$MYSQL_PASSWORD"
            echo "MYSQL_DATABASE=$MYSQL_DATABASE"
            echo "SESSAO_SEGREDO=$SESSAO_SEGREDO"
            echo "PAINEL_SENHA=$PAINEL_SENHA"
            echo "ADMIN_EMAILS=$ADMIN_EMAILS"
            echo "SITE_URL=$SITE_URL"
            # Fora da pasta do app, para as fotos não sumirem a cada publicação.
            echo "UPLOAD_DIR=${UPLOAD_DIR:-/home/$FTP_USUARIO/mone-fotos}"
          } > publicar/.env

      - name: Enviar para o servidor (FTPS)
        if: env.PUBLICAR == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVIDOR }}
          username: ${{ secrets.FTP_USUARIO }}
          password: ${{ secrets.FTP_SENHA }}
          protocol: ftps
          # O certificado do FTP da hospedagem costuma ser do nome do servidor, não do domínio.
          security: loose
          local-dir: ./publicar/
          server-dir: ${{ vars.PASTA_DO_APP || 'app' }}/
          exclude: |
            **/.git*
            **/.git*/**
